name: Build and release PDF

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-pdf-release
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the book
        uses: xu-cheng/latex-action@v4
        with:
          root_file: chip-design-book.tex
          # Match the TeX Live version used for the local book build.
          texlive_version: '2022'

      - name: Publish PDF as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          test -s chip-design-book.pdf
          printf 'Book built from commit %s on branch %s.\n\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > release-notes.md
          if gh release view latest > /dev/null 2>&1; then
            gh release upload latest chip-design-book.pdf --clobber
            gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --title "Latest PDF" \
              --notes-file release-notes.md --latest
          else
            gh release create latest chip-design-book.pdf \
              --target "$GITHUB_SHA" --title "Latest PDF" \
              --notes-file release-notes.md --latest
          fi

          # Remove the initial numbered release after publishing its replacement.
          if gh release view pdf-1-1 > /dev/null 2>&1; then
            gh release delete pdf-1-1 --cleanup-tag --yes
          fi
